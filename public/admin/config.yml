backend:
  name: git-gateway
  branch: main

media_folder: public/images
public_folder: /images

collections:
  - name: kurse
    label: Kurse
    folder: src/content/kurse
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Kurzbeschreibung", name: "description", widget: "text" }
      - { label: "Ausfuehrliche Beschreibung", name: "longDescription", widget: "markdown" }
      - label: "Kategorie"
        name: "kategorie"
        widget: "select"
        options:
          - { label: "Digital Marketing", value: "digital-marketing" }
          - { label: "Programmierung & Webentwicklung", value: "programmierung" }
          - { label: "Office & Produktivitaet", value: "office" }
          - { label: "KI & Datenanalyse", value: "ki-data" }
          - { label: "Design & Medien", value: "design" }
          - { label: "Fuehrung & Management", value: "fuehrung" }
      - label: "Format"
        name: "format"
        widget: "select"
        options:
          - { label: "Praesenz", value: "praesenz" }
          - { label: "Online", value: "online" }
          - { label: "Hybrid", value: "hybrid" }
      - label: "Zielgruppe"
        name: "zielgruppe"
        widget: "select"
        options:
          - { label: "Alle Zielgruppen", value: "alle" }
          - { label: "Privatpersonen", value: "privatperson" }
          - { label: "Unternehmen", value: "unternehmen" }
          - { label: "Arbeitssuchende", value: "arbeitssuchende" }
      - { label: "Dauer", name: "dauer", widget: "string" }
      - { label: "Preis (EUR)", name: "preis", widget: "number", value_type: "int" }
      - { label: "Naechster Termin", name: "naechsterTermin", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Bildungsgutschein moeglich", name: "bildungsgutschein", widget: "boolean", default: false }
      - label: "Icon"
        name: "icon"
        widget: "select"
        options:
          - { label: "Code", value: "code" }
          - { label: "Terminal", value: "terminal" }
          - { label: "Megaphone", value: "megaphone" }
          - { label: "Brain", value: "brain" }
          - { label: "Grid", value: "grid" }
          - { label: "Palette", value: "palette" }
          - { label: "Chart", value: "chart" }
          - { label: "Users", value: "users" }
          - { label: "Share", value: "share" }
      - label: "Highlights"
        name: "highlights"
        widget: "list"
        field: { label: "Highlight", name: "highlight", widget: "string" }

  - name: team
    label: Team
    folder: src/content/team
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Rolle", name: "rolle", widget: "string" }
      - { label: "Bereich", name: "bereich", widget: "string" }
      - { label: "Foto", name: "foto", widget: "image", required: false }
      - { label: "Reihenfolge", name: "order", widget: "number", value_type: "int", default: 0 }

  - name: seiten
    label: Seiten
    files:
      - label: "Startseite"
        name: "startseite"
        file: "src/content/seiten/startseite.md"
        fields:
          - { label: "Hero Titel", name: "heroTitle", widget: "string" }
          - { label: "Hero Untertitel", name: "heroSubtitle", widget: "text" }
          - { label: "Hero CTA Text", name: "heroCta", widget: "string" }
      - label: "Ueber uns"
        name: "ueber-uns"
        file: "src/content/seiten/ueber-uns.md"
        fields:
          - { label: "Mission Titel", name: "missionTitle", widget: "string" }
          - { label: "Mission Text", name: "missionText", widget: "markdown" }
